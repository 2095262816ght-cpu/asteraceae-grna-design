# Streamlit demo 专用环境（计B 9.25 用）
# 独立成环境的原因：genet 锁 tensorflow<2.10 → protobuf<3.20，
# 与 streamlit>=1.63 要求的 protobuf>=5.26 冲突，两者无法共存于 crispr 环境。
# demo 中打分通过子进程调用 crispr 环境的 python 运行 scripts/predict.py。
name: grna-demo
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pandas
  - pip
  - pip:
      - streamlit>=1.28
