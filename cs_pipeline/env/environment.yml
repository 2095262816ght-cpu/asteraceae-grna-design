name: crispr
channels:
  - conda-forge
  - bioconda
dependencies:
  # 直接依赖锁定为实测版本（Python 实测 3.10.21）；全量传递依赖锁定见 environment_export_0909.yml
  - python=3.10
  - r-base=4.3
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - biopython=1.88
  - matplotlib=3.10.9
  - joblib=1.6.0
  - scipy=1.15.2
  - pyfaidx=0.9.0.4
  # samtools 无 win-64 构建，Windows 上不随环境安装；
  # 9.20 需要交叉验证 .fai 时改用 WSL 或 samtools Windows 二进制（见分工详案 B1）
  - r-essentials
  - pip
  - pip:
      - genet==0.17.2   # DeepSpCas9 打分（降级方案1）；锁 tensorflow<2.10/protobuf<3.20
